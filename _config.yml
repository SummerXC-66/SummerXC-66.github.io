title: 我的学习记录
description: 记录学习历程，沉淀知识，方便回顾与浏览
author: SummerXC-66
url: "https://SummerXC-66.github.io"
baseurl: ""

# GitHub Pages 主题（可选，我们使用自定义样式）
theme: null

# 分页
paginate: 10
paginate_path: "/page/:num/"

# 构建设置
markdown: kramdown
highlighter: rouge
permalink: /notes/:year/:month/:day/:title/

# 保护 $...$ / $$...$$，避免下标 _ 被当成斜体；与 GitHub 公式语法一致
kramdown:
  math_engine: mathjax
  math_engine_opts:
    preview: false

# 导航
navigation:
  - title: 首页
    url: /
  - title: 全部笔记
    url: /notes.html
  - title: 关于
    url: /about.html

# 分类列表（笔记 front matter 中的 category 字段应使用以下值之一）
category_list:
  - 编程
  - 算法
  - 具身大模型算法
  - 部署
  - 工具
  - 阅读
  - 健康
